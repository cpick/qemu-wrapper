[package]
name = "qemu-plugin-ready"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = { version = "1.0.98", default-features = false, features = ["std"] }
ctor = { version = "0.4.2", default-features = false, features = [
  "proc_macro",
] }
ffi = { version = "0.1.1", default-features = false }
itertools = { version = "0.14.0", default-features = false, features = [
  "use_std",
] }
# FIXME: switch from `git =` to `version = "9.2.0-v0"` once it's published
# https://github.com/novafacing/qemu-rs/pull/31
qemu-plugin = { git = "https://github.com/cpick/qemu-rs.git", branch = "add-insn-read-data", features = [
  "plugin-api-v4",
], default-features = false }
