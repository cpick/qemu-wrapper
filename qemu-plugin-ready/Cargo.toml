[package]
name = "qemu-plugin-ready"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = { version = "1.0.98", default-features = false, features = ["std"] }
ctor = { version = "1.0.13", default-features = false, features = [
  "proc_macro",
  "std",
] }
ffi = { version = "0.1.1", default-features = false }
qemu-plugin = { version = "10.1.0-v2", default-features = false, features = [
  "anyhow",
  "plugin-api-v4",
] }
