[package]
name = "qemu-plugin-ready"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = { version = "1.0.98", default-features = false, features = ["std"] }
ctor = { version = "0.4.2", default-features = false, features = [
  "proc_macro",
] }
ffi = { version = "0.1.1", default-features = false }
itertools = { version = "0.14.0", default-features = false, features = [
  "use_std",
] }
qemu-plugin = { version = "9.0.0-v0", features = [
  "plugin-api-v3",
], default-features = false }
