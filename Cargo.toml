[workspace]
members = ["qemu-plugin-ready"]
resolver = "3"

[package]
name = "qemu-wrapper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.98", default-features = false, features = ["std"] }
nix = { version = "0.29.0", default-features = false, features = [
  "fs",
  "poll",
  "signal",
  "term",
] }
signal-hook = { version = "0.3.17", default-features = false, features = [
  "iterator",
] }
